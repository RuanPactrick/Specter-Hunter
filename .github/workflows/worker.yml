# Worker gratuito: roda a fila (Nova pesquisa e Ler sites) a cada 5 minutos no GitHub Actions e encerra.
# Repositório público = minutos ilimitados. As chaves ficam em Settings → Secrets and variables → Actions.
name: Worker (rodada agendada)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Conferir as chaves
        id: keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # sem as chaves cadastradas, a rodada termina em silêncio em vez de falhar a cada 5 minutos
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Chaves do Supabase não cadastradas nos Secrets do repositório; nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        if: steps.keys.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rodar a fila
        if: steps.keys.outputs.ready == 'true'
        run: npx tsx worker/index.ts
        env:
          WORKER_ONCE: "1"
          WORKER_MAX_MINUTES: "20"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_APIFY: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_OFFICIAL_PAGE_READING: "true"
