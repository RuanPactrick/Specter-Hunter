# Reserva manual: o robô agora roda na Vercel (rota /api/worker, Vercel Cron a cada minuto e logo após cada clique).
# Este workflow só roda se você clicar em Actions → Worker (rodada manual) → Run workflow.
name: Worker (rodada manual)
on:
  workflow_dispatch:
concurrency:
  group: worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Conferir as chaves
        id: keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        # sem as chaves cadastradas, a rodada termina em silêncio em vez de falhar a cada 5 minutos
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Chaves do Supabase não cadastradas nos Secrets do repositório; nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # confere o formato sem mostrar os valores
          ok=true
          if ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https://[a-z0-9-]+\.supabase\.co/?$'; then
            echo "::error::O secret SUPABASE_URL deve ser exatamente https://<projeto>.supabase.co (sem espaços, aspas ou /dashboard)."; ok=false
          fi
          if ! printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | grep -Eq '^(sb_secret_|eyJ)[A-Za-z0-9._-]+$'; then
            echo "::error::O secret SUPABASE_SERVICE_ROLE_KEY deve ser a chave secreta (começa com sb_secret_ ou eyJ), sem espaços ou aspas."; ok=false
          fi
          if [ -z "$APIFY_TOKEN" ]; then echo "::warning::APIFY_TOKEN não cadastrado: a leitura roda sem pesquisa no Google, Instagram e anúncios."; fi
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = true ]
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        if: steps.keys.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rodar a fila
        if: steps.keys.outputs.ready == 'true'
        run: npx tsx worker/index.ts
        env:
          WORKER_ONCE: "1"
          WORKER_MAX_MINUTES: "20"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENABLE_APIFY: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ENABLE_OFFICIAL_PAGE_READING: "true"
